    <title>IEEE SPS Challenge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(-45deg, #001f3f, #0074D9, #ffffff, #00c853);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        @keyframes bgMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .particles span {
            position: absolute;
            display: block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .7);
            animation: float 15s linear infinite;
        }

        @keyframes float {
            from {
                transform: translateY(100vh) scale(0);
            }

            to {
                transform: translateY(-120px) scale(1);
            }
        }

        .card {
            width: 90%;
            max-width: 900px;
            padding: 50px;
            text-align: center;
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(0, 0, 0, .25);
            color: white;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 255, 255, .8);
        }

        h2 {
            margin-top: 15px;
            color: #dfffe0;
            font-weight: 500;
        }

        .divider {
            width: 120px;
            height: 4px;
            margin: 20px auto;
            background: linear-gradient(90deg, #00c853, #ffffff, #0074D9);
            border-radius: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scaleX(1);
            }

            50% {
                transform: scaleX(1.3);
            }
        }

        p {
            margin-top: 20px;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .glow {
            color: #fff;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff;
            }

            to {
                text-shadow: 0 0 25px #00c853, 0 0 40px #0074D9;
            }
        }

        footer {
            margin-top: 30px;
            font-size: .9rem;
            opacity: .85;
        }
    </style>
</head>
